name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.4"
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src tests benchmarks/development benchmarks/capabilities_v2
      - run: uv run --no-sync ruff format --check src tests benchmarks/development benchmarks/capabilities_v2
      - run: docker build -t casi-sandbox:latest -f docker/sandbox.Dockerfile .
      - run: uv run --no-sync python benchmarks/capabilities_v2/validate.py --output /tmp/casi-v2-validation.json
      - run: uv run --no-sync pytest -ra
      - run: uv run --no-sync python -m compileall -q src tests benchmarks/capabilities_v2
