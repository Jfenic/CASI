id: dev_010
name: slug_tests
repository: slug_tests
category: create
capability: regression_test_design
difficulty: basic
instruction: 'Create test_slug.py with pytest regression tests for slugify(text) in
  slug.py, without changing implementation. Contract: lowercase text; keep only ASCII
  a-z and digits 0-9; replace each consecutive run of other characters with one hyphen;
  remove leading/trailing hyphens. Empty or punctuation-only input gives an empty
  string. Test uppercase, digits, punctuation, repeated separators, boundary separators
  and empty input. Create only test_slug.py.'
allowed_files:
- test_slug.py
grader: ../graders/slug_tests
max_steps: 18
success_command:
- python3
- -m
- pytest
- -q
