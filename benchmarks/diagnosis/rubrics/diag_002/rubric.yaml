file: clamp.py
line:
  min: 10
  max: 12
cause:
  any: ["+ 1", "plus one", "adds one", "off by one", "increments", "too high"]
evidence:
  any: ["value + 1", "+ 1", "return value"]
max_words: 40
forbidden:
  - "```diff"
  - "propose_file"
  - "apply_patch"
required_fields:
  - file
  - line
  - cause
  - evidence
