file: validator.py
line:
  min: 6
  max: 8
cause:
  any: ["@", "at sign", "dot only", "only checks", "missing at", "incomplete"]
evidence:
  any: ['"." in email', "in email", "dot", "is_valid_email"]
forbidden:
  - "```diff"
  - "propose_file"
  - "apply_patch"
required_fields:
  - file
  - line
  - cause
  - evidence
